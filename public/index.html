<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>AI Chatbot</title>

  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="chat-wrapper">
    <section class="chat-card">
      <div id="settingsBackdrop" class="settings-backdrop" hidden></div>

      <aside
        id="settingsPanel"
        class="settings-panel"
        aria-label="Settings"
        aria-hidden="true"
      >
        <div class="settings-panel-header">
          <h2>Settings</h2>
          <button
            type="button"
            id="settingsClose"
            class="icon-button"
            aria-label="Close settings"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M18.3 5.71a1 1 0 0 0-1.41 0L12 10.59 7.11 5.7A1 1 0 0 0 5.7 7.11L10.59 12l-4.89 4.89a1 1 0 1 0 1.41 1.41L12 13.41l4.89 4.89a1 1 0 0 0 1.41-1.41L13.41 12l4.89-4.89a1 1 0 0 0 0-1.4z"/>
            </svg>
          </button>
        </div>

        <div class="settings-panel-body">
          <div class="settings-field">
            <label for="providerSelect">Provider</label>
            <select id="providerSelect" disabled>
              <option value="">Loading...</option>
            </select>
          </div>

          <div class="settings-field">
            <label for="modelSelect">Model</label>
            <select id="modelSelect" disabled>
              <option value="">Loading...</option>
            </select>
          </div>

          <p id="settingsHint" class="settings-hint" hidden></p>
        </div>
      </aside>

      <header class="chat-header">
        <div class="header-left">
          <button
            type="button"
            id="settingsToggle"
            class="icon-button settings-toggle"
            aria-label="Open settings"
            aria-expanded="false"
            aria-controls="settingsPanel"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
            </svg>
          </button>

          <div class="chat-header-main">
            <h1 id="conversationTitle">New chat</h1>
            <p id="status">Checking connection...</p>
          </div>
        </div>

        <div class="header-actions">
          <button
            type="button"
            id="newConversationButton"
            class="icon-button"
            aria-label="New conversation"
            title="New conversation"
          >
            <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
              <path fill="currentColor" d="M19 11h-6V5a1 1 0 1 0-2 0v6H5a1 1 0 1 0 0 2h6v6a1 1 0 1 0 2 0v-6h6a1 1 0 1 0 0-2z"/>
            </svg>
          </button>

          <button
            type="button"
            id="deleteConversationButton"
            class="icon-button"
            aria-label="Delete conversation"
            title="Delete conversation"
          >
            <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path fill="currentColor" d="M9 3a1 1 0 0 0-1 1v1H5a1 1 0 1 0 0 2h1v12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7h1a1 1 0 1 0 0-2h-3V4a1 1 0 0 0-1-1H9zm1 2h4v1h-4V5zm-2 2h8v12H8V7zm2 3a1 1 0 0 0-1 1v5a1 1 0 1 0 2 0v-5a1 1 0 0 0-1-1zm4 0a1 1 0 0 0-1 1v5a1 1 0 1 0 2 0v-5a1 1 0 0 0-1-1z"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="conversation-layout">
        <aside class="conversation-sidebar" aria-label="Conversation history">
          <div class="conversation-sidebar-header">
            <span>Conversations</span>
          </div>
          <div id="conversationList" class="conversation-list"></div>
        </aside>

        <section class="conversation-main">
          <div id="dropOverlay" class="drop-overlay" hidden>
            <p>Drop files here</p>
            <span>Text files are read into the message; images need a vision model</span>
          </div>

          <div id="chatMessages" class="chat-messages"></div>

          <form id="chatForm" class="chat-form">
            <div class="chat-form-main">
              <div id="attachments" class="attachments" hidden></div>

              <div class="chat-form-row">
                <textarea
                  id="messageInput"
                  placeholder="Write a message or drop files..."
                  rows="1"
                ></textarea>

                <button id="sendButton" type="submit">
                  Send
                </button>
              </div>
            </div>
          </form>
        </section>
      </div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
